<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 外部监控雷达圈 -->
  <circle cx="12" cy="12" r="10" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- 安全盾牌 -->
  <path d="M12 18s5-2.5 5-6.5V7.5L12 5 7 7.5v4c0 4 5 6.5 5 6.5z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <!-- 白色对勾 -->
  <path d="m9.5 11 1.5 1.5 3.5-3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>