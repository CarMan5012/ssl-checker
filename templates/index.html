            const webhook = document.getElementById('cfg_dingtalk_webhook').value.trim();
            if (webhook && !/^https?:\/\/.+/.test(webhook) && !/^[A-Za-z0-9\-_]{20,}$/.test(webhook)) {
                showFieldError('cfg_dingtalk_webhook', 'err_dingtalk_webhook', '请填写完整的 Webhook URL (https://...) 或有效的 Access Token');
                valid = false;
            }

            // === SMTP 配置：以"SMTP 主机"作为开关 ===
            // 只有填写了 SMTP 主机才启用整块 SMTP 校验；主机为空时其余字段自由填写，不拦截
            const smtpHost = document.getElementById('cfg_smtp_host').value.trim();
            const smtpPortRaw = document.getElementById('cfg_smtp_port').value.trim();
            const smtpUser = document.getElementById('cfg_smtp_user').value.trim();
            const emailTo = document.getElementById('cfg_email_to').value.trim();

            if (smtpHost) {
                // SMTP 端口：填写了主机则端口必须合法
                if (!smtpPortRaw) {
                    showFieldError('cfg_smtp_port', 'err_smtp_port', '端口不能为空');
                    valid = false;
                } else {
                    const port = parseInt(smtpPortRaw);
                    if (isNaN(port) || port < 1 || port > 65535) {
                        showFieldError('cfg_smtp_port', 'err_smtp_port', '端口范围应在 1 ~ 65535 之间');
                        valid = false;
                    }
                }
                // 发信账号：主机启用时必填，且格式须合法
                if (!smtpUser) {
                    showFieldError('cfg_smtp_user', 'err_smtp_user', '发信账号不能为空');
                    valid = false;
                } else if (!emailRegex.test(smtpUser)) {
                    showFieldError('cfg_smtp_user', 'err_smtp_user', '请输入有效的邮箱地址');
                    valid = false;
                }
                // 收件人：主机启用时必填
                if (!emailTo) {
                    showFieldError('cfg_email_to', 'err_email_to', '收件人邮箱不能为空');
                    valid = false;
                } else {
                    const recipients = emailTo.split(',').map(s => s.trim()).filter(Boolean);
                    const invalidAddr = recipients.find(addr => !emailRegex.test(addr));
                    if (invalidAddr) {
                        showFieldError('cfg_email_to', 'err_email_to', `"${invalidAddr}" 不是有效的邮箱地址`);
                        valid = false;
                    }
                }
            } else {
                // 主机未填：仅对已填写的收件人/账号做格式校验，不强制必填
                if (smtpPortRaw) {
                    const port = parseInt(smtpPortRaw);
                    if (isNaN(port) || port < 1 || port > 65535) {
                        showFieldError('cfg_smtp_port', 'err_smtp_port', '端口范围应在 1 ~ 65535 之间');
                        valid = false;
                    }
                }
                if (smtpUser && !emailRegex.test(smtpUser)) {
                    showFieldError('cfg_smtp_user', 'err_smtp_user', '请输入有效的邮箱地址');
                    valid = false;
                }
                if (emailTo) {
                    const recipients = emailTo.split(',').map(s => s.trim()).filter(Boolean);
                    const invalidAddr = recipients.find(addr => !emailRegex.test(addr));
                    if (invalidAddr) {
                        showFieldError('cfg_email_to', 'err_email_to', `"${invalidAddr}" 不是有效的邮箱地址`);
                        valid = false;
                    }
                }
            }

            // === 告警天数：必须为正整数，且 严重 < 警告 < 提醒 ===
            const infoVal   = parseInt(document.getElementById('cfg_alert_info_days').value);
            const warnVal   = parseInt(document.getElementById('cfg_alert_warning_days').value);
            const critVal   = parseInt(document.getElementById('cfg_alert_critical_days').value);

            if (!infoVal || infoVal < 1 || infoVal > 365) {
                showFieldError('cfg_alert_info_days', 'err_alert_info_days', '提醒天数应为 1 ~ 365 的正整数');
                valid = false;
            }
            if (!warnVal || warnVal < 1 || warnVal > 365) {
                showFieldError('cfg_alert_warning_days', 'err_alert_warning_days', '警告天数应为 1 ~ 365 的正整数');
                valid = false;
            }
            if (!critVal || critVal < 1 || critVal > 365) {
                showFieldError('cfg_alert_critical_days', 'err_alert_critical_days', '严重天数应为 1 ~ 365 的正整数');
                valid = false;
            }
            if (valid && !(critVal < warnVal && warnVal < infoVal)) {
                const msg = '天数阈值需满足：严重 < 警告 < 提醒';
                showFieldError('cfg_alert_critical_days', 'err_alert_critical_days', msg);
                showFieldError('cfg_alert_warning_days', 'err_alert_warning_days', msg);
                showFieldError('cfg_alert_info_days',    'err_alert_info_days',    msg);
                valid = false;
            }

            return valid;
        }

        async function saveSettings() {
            // 先执行前端校验，校验失败直接返回不提交
            if (!validateSettingsForm()) {
                showToast('请检查并修正表单中的错误项', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveSettingsBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = "保存中...";

            const payload = {
                dingtalk_webhook: document.getElementById('cfg_dingtalk_webhook').value.trim(),
                dingtalk_secret: document.getElementById('cfg_dingtalk_secret').value,
                dingtalk_keyword: document.getElementById('cfg_dingtalk_keyword').value.trim(),

                smtp_host: document.getElementById('cfg_smtp_host').value.trim(),
                smtp_port: parseInt(document.getElementById('cfg_smtp_port').value) || 465,
                smtp_user: document.getElementById('cfg_smtp_user').value.trim(),
                smtp_pass: document.getElementById('cfg_smtp_pass').value,
                email_to: document.getElementById('cfg_email_to').value.trim(),

                alert_info_days: parseInt(document.getElementById('cfg_alert_info_days').value) || 14,
                alert_warning_days: parseInt(document.getElementById('cfg_alert_warning_days').value) || 7,
                alert_critical_days: parseInt(document.getElementById('cfg_alert_critical_days').value) || 3
            };

            // 进行智能参数变更模块对比
            let changedModules = [];
            if (originalSettings) {
                if (payload.dingtalk_webhook !== originalSettings.dingtalk_webhook ||
                    payload.dingtalk_secret !== originalSettings.dingtalk_secret ||
                    payload.dingtalk_keyword !== originalSettings.dingtalk_keyword) {
                    changedModules.push("钉钉告警");
                }
                
                if (payload.smtp_host !== originalSettings.smtp_host ||
                    payload.smtp_port !== originalSettings.smtp_port ||
                    payload.smtp_user !== originalSettings.smtp_user ||
                    payload.smtp_pass !== originalSettings.smtp_pass ||
                    payload.email_to !== originalSettings.email_to) {
                    changedModules.push("邮件告警");
                }
                
                if (payload.alert_info_days !== originalSettings.alert_info_days ||
                    payload.alert_warning_days !== originalSettings.alert_warning_days ||
                    payload.alert_critical_days !== originalSettings.alert_critical_days) {
                    changedModules.push("告警天数");
                }
            }

            try {
                const res = await apiFetch("/api/settings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res) return;

                const data = await res.json();
                if (res.ok) {
                    if (changedModules.length === 0) {
                        showToast("配置保存成功 (未发生内容修改)", "info");
                    } else {
                        showToast(`${changedModules.join("、")}配置保存成功`);
                    }
                    closeSettingsDrawer();
                    // 仅当告警天数发生变化时才重新计算状态，其他配置变动无需资耗刷新列表
                    if (changedModules.includes("告警天数") && allData.length > 0) {
                        await loadDomains();
                    }
                } else {
                    showToast(data.error || "保存失败", "error");
                }
            } catch (e) {
                if (e.message !== "Unauthorized") {
                    showToast("保存异常", "error");
                }
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "保存配置";
            }
        }

        /* ---------------------------------------------------------
         * 模态框域名删除
         * --------------------------------------------------------- */
        function confirmDeleteDomain(domain) {
            deleteTargetDomain = domain;
            const parsed = parseDomain(domain);
            document.getElementById('modalMessage').innerHTML = `确定要停止对域名 <strong style="color:var(--danger-color);">${parsed.host}</strong> (端口: ${parsed.port}) 的 SSL 监控吗？`;
            
            const modal = document.getElementById('confirmModal');
            modal.classList.add('show');
            
            document.getElementById('confirmModalBtn').onclick = () => executeDelete();
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            deleteTargetDomain = null;
        }

        async function executeDelete() {
            if (!deleteTargetDomain) return;
            const domain = deleteTargetDomain;
            closeConfirmModal();

            try {
                const res = await apiFetch("/api/domains", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ domain: domain })
                });
                if (!res) return;

                const data = await res.json();
                if (res.ok) {
                    showToast("已删除监控目标");
                    await loadDomains();
                } else {
                    showToast(data.error || "删除失败", "error");
                }
            } catch (e) {
                if (e.message !== "Unauthorized") {
                    showToast("删除异常", "error");
                }
            }
        }
    </script>
