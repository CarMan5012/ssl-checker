<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL 证书监控管理</title>
    <!-- 引入现代字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* ---------------------------------------------------------
         * 全局设计系统与双主题配置
         * --------------------------------------------------------- */
        :root {
            --font-display: 'Outfit', 'Inter', -apple-system, sans-serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            
            /* 明亮主题 */
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e6effc 50%, #f3f7fa 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: rgba(226, 232, 240, 0.8);
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.15);
            --hover-bg: rgba(241, 245, 249, 0.6);
            --danger-color: #ef4444;
            --danger-bg: #fee2e2;
            --danger-hover: #fca5a5;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(148, 163, 184, 0.05);
            --shadow-md: 0 8px 30px rgba(148, 163, 184, 0.08);
            --shadow-lg: 0 20px 40px rgba(148, 163, 184, 0.12);
            --glass-blur: 16px;
            
            /* 状态颜色 */
            --status-ok: #166534;
            --status-ok-bg: #dcfce7;
            --status-ok-border: rgba(34, 197, 94, 0.2);
            --status-info: #1e40af;
            --status-info-bg: #dbeafe;
            --status-info-border: rgba(59, 130, 246, 0.2);
            --status-warn: #92400e;
            --status-warn-bg: #fef3c7;
            --status-warn-border: rgba(245, 158, 11, 0.2);
            --status-crit: #991b1b;
            --status-crit-bg: #fee2e2;
            --status-crit-border: rgba(239, 68, 68, 0.2);
            --status-fail: #475569;
            --status-fail-bg: #f1f5f9;
            --status-fail-border: rgba(148, 163, 184, 0.2);
        }

        body.dark-mode {
            /* 暗黑主题 */
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #111a30 100%);
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --hover-bg: rgba(255, 255, 255, 0.02);
            --danger-color: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.15);
            --danger-hover: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.85);
            --input-border: rgba(255, 255, 255, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            
            /* 暗黑状态 */
            --status-ok: #4ade80;
            --status-ok-bg: rgba(74, 222, 128, 0.1);
            --status-ok-border: rgba(74, 222, 128, 0.2);
            --status-info: #60a5fa;
            --status-info-bg: rgba(96, 165, 250, 0.1);
            --status-info-border: rgba(96, 165, 250, 0.2);
            --status-warn: #fbbf24;
            --status-warn-bg: rgba(251, 191, 36, 0.15);
            --status-warn-border: rgba(251, 191, 36, 0.2);
            --status-crit: #f87171;
            --status-crit-bg: rgba(248, 113, 113, 0.15);
            --status-crit-border: rgba(248, 113, 113, 0.2);
            --status-fail: #cbd5e1;
            --status-fail-bg: rgba(203, 213, 225, 0.08);
            --status-fail-border: rgba(203, 213, 225, 0.15);
        }

        /* ---------------------------------------------------------
         * 基础页面重置与框架布局
         * --------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.15s ease;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 20px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon-wrapper {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
            100% { box-shadow: 0 4px 24px rgba(59, 130, 246, 0.7); }
        }

        h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text-primary) 0%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ---------------------------------------------------------
         * 仪表盘统计与健康评分
         * --------------------------------------------------------- */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: 1.2fr 2fr;
            }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .health-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .health-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .health-value {
            font-family: var(--font-display);
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-shadow: 0 4px 12px var(--primary-glow);
        }

        .health-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 10px;
        }

        .health-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
            border-radius: 999px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .health-status-desc {
            font-size: 13px;
            margin-top: 8px;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        body.dark-mode .stat-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .stat-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: rgba(255, 255, 255, 0.4);
        }

        body.dark-mode .stat-item:hover {
            background: rgba(15, 23, 42, 0.7);
        }

        .stat-item.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .stat-icon {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .stat-item.ok .stat-icon { background: var(--status-ok-bg); color: var(--status-ok); }
        .stat-item.info .stat-icon { background: var(--status-info-bg); color: var(--status-info); }
        .stat-item.warn .stat-icon { background: var(--status-warn-bg); color: var(--status-warn); }
        .stat-item.crit .stat-icon { background: var(--status-crit-bg); color: var(--status-crit); }
        .stat-item.fail .stat-icon { background: var(--status-fail-bg); color: var(--text-secondary); }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-count {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
        }

        .stat-item.ok .stat-count { color: var(--status-ok); }
        .stat-item.info .stat-count { color: var(--status-info); }
        .stat-item.warn .stat-count { color: var(--status-warn); }
        .stat-item.crit .stat-count { color: var(--status-crit); }
        .stat-item.fail .stat-count { color: var(--text-primary); }

        /* ---------------------------------------------------------
         * 顶部工具栏与过滤器 Tab
         * --------------------------------------------------------- */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 20px;
            margin-bottom: 8px;
        }

        @media (min-width: 992px) {
            .toolbar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        .input-field {
            width: 100%;
            padding: 11px 12px 11px 38px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            box-shadow: var(--shadow-sm);
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .validation-hint {
            position: absolute;
            left: 4px;
            top: calc(100% + 4px);
            font-size: 11px;
            color: var(--danger-color);
            display: none;
        }

        .input-field.invalid {
            border-color: var(--danger-color);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .input-field.invalid + .validation-hint {
            display: block;
        }

        .search-wrapper {
            position: relative;
            min-width: 220px;
        }

        .search-wrapper .input-field {
            padding-right: 32px;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            width: 14px;
            height: 14px;
            display: none;
        }

        .search-clear:hover {
            color: var(--text-secondary);
        }

        .filter-tabs {
            display: flex;
            background: var(--border-color);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* ---------------------------------------------------------
         * 按钮组件
         * --------------------------------------------------------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-sm);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .btn-icon-only {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-icon-only:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        /* 顶部图标按钮 tooltip 悬停提示气泡 */
        .btn-icon-only[title] {
            position: relative;
        }

        .btn-icon-only[title]::after {
            content: attr(title);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(15, 23, 42, 0.85);
            color: #f1f5f9;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 100;
        }

        .btn-icon-only[title]:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .btn-danger-link {
            color: var(--danger-color);
            background: transparent;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-danger-link:hover {
            background: var(--danger-bg);
        }

        /* ---------------------------------------------------------
         * 数据表格
         * --------------------------------------------------------- */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 16px 20px;
        }

        th {
            background: var(--hover-bg);
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        td {
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover td {
            background-color: var(--hover-bg);
        }

        .domain-cell {
            font-weight: 600;
            font-family: var(--font-sans);
            color: var(--text-primary);
        }

        .port-cell {
            color: var(--text-secondary);
            font-family: monospace;
            font-size: 13px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .badge-ok { background: var(--status-ok-bg); color: var(--status-ok); border-color: var(--status-ok-border); }
        .badge-ok .badge-dot { background: var(--status-ok); }
        
        .badge-info { background: var(--status-info-bg); color: var(--status-info); border-color: var(--status-info-border); }
        .badge-info .badge-dot { background: var(--status-info); }
        
        .badge-warn { background: var(--status-warn-bg); color: var(--status-warn); border-color: var(--status-warn-border); }
        .badge-warn .badge-dot { background: var(--status-warn); }
        
        .badge-crit { background: var(--status-crit-bg); color: var(--status-crit); border-color: var(--status-crit-border); }
        .badge-crit .badge-dot { background: var(--status-crit); }
        
        .badge-fail { background: var(--status-fail-bg); color: var(--text-secondary); border-color: var(--status-fail-border); }
        .badge-fail .badge-dot { background: var(--text-secondary); }

        .days-value {
            font-weight: 700;
            font-family: var(--font-display);
        }
        .days-ok { color: var(--status-ok); }
        .days-info { color: var(--status-info); }
        .days-warn { color: var(--status-warn); }
        .days-crit { color: var(--status-crit); }

        .date-cell {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .action-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ---------------------------------------------------------
         * 骨架屏动画
         * --------------------------------------------------------- */
        .skeleton-row td {
            padding: 20px;
        }

        .skeleton-bar {
            height: 14px;
            background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes skeleton-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-domain { width: 60%; }
        .skeleton-port { width: 30%; }
        .skeleton-badge { width: 50px; height: 22px; border-radius: 999px; }
        .skeleton-days { width: 40px; }
        .skeleton-date { width: 80%; }

        .refreshing-row {
            opacity: 0.6;
        }
        .refreshing-row .btn, .refreshing-row .btn-danger-link {
            pointer-events: none;
            opacity: 0.5;
        }

        .spin {
            animation: spin 1s linear infinite;
            display: inline-block;
            transform-origin: center;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            color: var(--text-muted);
            margin-bottom: 16px;
            display: inline-block;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .empty-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ---------------------------------------------------------
         * Toast 提示系统
         * --------------------------------------------------------- */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            min-width: 280px;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        .toast-success .toast-icon { color: var(--status-ok); }
        .toast-error .toast-icon { color: var(--danger-color); }
        .toast-info .toast-icon { color: var(--status-info); }

        .toast-content {
            flex: 1;
        }

        .toast-message {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* ---------------------------------------------------------
         * Modal 弹窗基础样式
         * --------------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9990;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        body.dark-mode .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--danger-bg);
            color: var(--danger-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ---------------------------------------------------------
         * SPA 全屏登录/注册锁屏控制层
         * --------------------------------------------------------- */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-gradient);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* 登录锁屏激活时，隐藏 body 背景内容，防止看板内容露出 */
        body.auth-active > .container {
            visibility: hidden;
        }

        .auth-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 36px 30px;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-overlay.show .auth-card {
            transform: translateY(0);
        }

        .auth-logo-icon {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .auth-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* 明密文输入小眼睛 */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container .input-field {
            padding-right: 40px;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn:hover {
            color: var(--text-secondary);
        }

        /* ---------------------------------------------------------
         * 系统设置侧边抽屉 (Settings Drawer)
         * --------------------------------------------------------- */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 9980;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.dark-mode .drawer-overlay {
            background: rgba(0, 0, 0, 0.4);
        }

        .drawer-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            z-index: 9981;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.show .drawer {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
        }

        .drawer-footer {
            padding: 20px 28px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            background: var(--hover-bg);
        }

        .setting-section {
            margin-bottom: 28px;
        }

        .setting-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* ---------------------------------------------------------
         * 表单输入校验状态样式
         * --------------------------------------------------------- */
        .input-field.is-error {
            border-color: var(--danger-color) !important;
            background: rgba(239, 68, 68, 0.04) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12) !important;
            animation: shake 0.4s ease;
        }

        .field-error-msg {
            display: none;
            font-size: 11px;
            color: var(--danger-color);
            margin-top: 4px;
            align-items: center;
            gap: 4px;
        }

        .field-error-msg.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-5px); }
            40%       { transform: translateX(5px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* ---------------------------------------------------------
         * 表格排序样式
         * --------------------------------------------------------- */
        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease;
        }

        th.sortable:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }

        .sort-header-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            vertical-align: middle;
        }

        th.sortable .sort-icon {
            width: 14px;
            height: 14px;
            opacity: 0.35;
            transition: opacity 0.2s ease, color 0.2s ease;
            flex-shrink: 0;
            margin-top: 1px;
        }

        th.sortable.active-sort {
            color: var(--primary-color);
            font-weight: 700;
        }

        th.sortable.active-sort .sort-icon {
            opacity: 1;
            color: var(--primary-color);
        }

        /* ---------------------------------------------------------
         * 物理路由视图区块切换
         * --------------------------------------------------------- */
        .route-view {
            display: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .route-view.active {
            display: block;
            opacity: 1;
        }

        /* ---------------------------------------------------------
         * 公共悬浮导航栏
         * --------------------------------------------------------- */
        .nav-menu {
            display: none;
            background: var(--hover-bg);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
            border: 1px solid var(--border-color);
        }

        .nav-menu.show {
            display: flex;
        }

        .nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.25);
        }

        body.dark-mode .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: var(--card-bg);
            color: var(--primary-color);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header>
            <div class="logo-area">
                <div class="logo-icon-wrapper">
                    <i data-lucide="shield-check" style="width: 22px; height: 22px;"></i>
                </div>
                <div>
                    <h1>SSL 证书监控看板</h1>
                    <p style="font-size: 11px; color: var(--text-secondary); font-weight: 500;">实时证书巡检 · 智能分级告警</p>
                </div>
            </div>

            <!-- 导航链接菜单 -->
            <nav class="nav-menu" id="navMenu">
                <button class="nav-item active" onclick="navigate('/dashboard')" id="nav-dashboard" style="display: none;">
                    <i data-lucide="bar-chart-3" style="width: 14px; height: 14px;"></i>
                    <span>监控看板</span>
                </button>
                <button class="nav-item" onclick="navigate('/dashboard/domains')" id="nav-domains" style="display: none;">
                    <i data-lucide="globe" style="width: 14px; height: 14px;"></i>
                    <span>域名管理</span>
                </button>
            </nav>

            <div class="action-group">
                <!-- 管理员登录入口 (未登录时展示) -->
                <button class="btn btn-primary" onclick="navigate('/login')" id="loginEntranceBtn" title="管理员登录" style="display: none; gap: 6px; padding: 8px 16px; font-size: 13px;">
                    <i data-lucide="log-in" style="width: 14px; height: 14px;"></i>
                    <span>管理员登录</span>
                </button>
                <!-- 检查更新 (全局刷新) -->
                <button class="btn btn-secondary btn-icon-only" onclick="loadDomains(true)" id="refreshBtn" title="检查更新" style="display: none;">
                    <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                </button>
                <!-- 主题切换 -->
                <button class="btn btn-secondary btn-icon-only" onclick="toggleTheme()" id="themeBtn" title="切换主题">
                    <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
                </button>
                <!-- 告警配置 -->
                <button class="btn btn-secondary btn-icon-only" onclick="openSettingsDrawer()" id="settingsBtn" title="告警配置" style="display: none;">
                    <i data-lucide="settings" style="width: 16px; height: 16px;"></i>
                </button>
                <!-- 安全退出 -->
                <button class="btn btn-secondary btn-icon-only" onclick="handleLogout()" id="logoutBtn" title="注销退出" style="display: none; color: var(--danger-color); border-color: rgba(239, 68, 68, 0.15);">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
        </header>

        <!-- 1. 监控大屏视图 -->
        <div id="view-dashboard" class="route-view">
            <!-- 仪表盘统计区块 -->
            <div class="dashboard">
                <!-- 系统整体健康度 -->
                <div class="glass-card health-card">
                    <span class="health-title">系统整体健康度</span>
                    <span class="health-value" id="healthScore">0%</span>
                    <div class="health-bar-container">
                        <div class="health-bar" id="healthBar"></div>
                    </div>
                    <span class="health-status-desc" id="healthDesc">正在统计证书状态...</span>
                </div>

                <!-- 分类统计网格 -->
                <div class="glass-card stats-grid" id="statsGrid">
                    <!-- 正常 -->
                    <div class="stat-item ok" onclick="setFilter('正常')" id="filter-normal">
                        <div class="stat-icon"><i data-lucide="shield-check" style="width: 16px; height: 16px;"></i></div>
                        <span class="stat-label">正常</span>
                        <span class="stat-count" id="stat-ok">0</span>
                    </div>
                    <!-- 提醒 -->
                    <div class="stat-item info" onclick="setFilter('提醒')" id="filter-info">
                        <div class="stat-icon"><i data-lucide="info" style="width: 16px; height: 16px;"></i></div>
                        <span class="stat-label">提醒</span>
                        <span class="stat-count" id="stat-info">0</span>
                    </div>
                    <!-- 警告 -->
                    <div class="stat-item warn" onclick="setFilter('警告')" id="filter-warn">
                        <div class="stat-icon"><i data-lucide="alert-triangle" style="width: 16px; height: 16px;"></i></div>
                        <span class="stat-label">警告</span>
                        <span class="stat-count" id="stat-warn">0</span>
                    </div>
                    <!-- 严重 -->
                    <div class="stat-item crit" onclick="setFilter('严重')" id="filter-crit">
                        <div class="stat-icon"><i data-lucide="alert-octagon" style="width: 16px; height: 16px;"></i></div>
                        <span class="stat-label">严重</span>
                        <span class="stat-count" id="stat-crit">0</span>
                    </div>
                    <!-- 失败 -->
                    <div class="stat-item fail" onclick="setFilter('失败')" id="filter-fail">
                        <div class="stat-icon"><i data-lucide="x-circle" style="width: 16px; height: 16px;"></i></div>
                        <span class="stat-label">失败</span>
                        <span class="stat-count" id="stat-fail">0</span>
                    </div>
                </div>
            </div>

            <!-- 数据只读列表卡片 -->
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <!-- 监控大屏工具栏 -->
                <div class="toolbar" style="justify-content: flex-end;">
                    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                        <!-- 搜索输入 -->
                        <div class="search-wrapper">
                            <i data-lucide="search" class="input-icon"></i>
                            <input type="text" id="searchInput" class="input-field" 
                                   placeholder="过滤域名/端口..." 
                                   oninput="handleSearch(this.value)">
                            <i data-lucide="x" class="search-clear" id="searchClearBtn" onclick="clearSearch()"></i>
                        </div>
                        <!-- 快速过滤器 Tab -->
                        <div class="filter-tabs">
                            <button class="tab-btn active" id="tab-all" onclick="setFilter('全部')">全部</button>
                            <button class="tab-btn" id="tab-focus" onclick="setFilter('关注')">需关注</button>
                        </div>
                    </div>
                </div>
                
                <!-- 只读表格数据 -->
                <div class="table-container">
                    <table id="domainTable">
                        <thead>
                            <tr>
                                <th class="sortable" onclick="handleSort('domain')" id="sort-read-domain"><div class="sort-header-container"><span>监控域名</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('port')" id="sort-read-port"><div class="sort-header-container"><span>端口</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('status')" id="sort-read-status"><div class="sort-header-container"><span>状态</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('days')" id="sort-read-days"><div class="sort-header-container"><span>到期余天</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('expire')" id="sort-read-expire"><div class="sort-header-container"><span>过期时间 / 错误原因</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                            </tr>
                        </thead>
                        <tbody id="domainList">
                            <!-- 骨架屏 -->
                            <tr class="skeleton-row">
                                <td><div class="skeleton-bar skeleton-domain"></div></td>
                                <td><div class="skeleton-bar skeleton-port"></div></td>
                                <td><div class="skeleton-bar skeleton-badge"></div></td>
                                <td><div class="skeleton-bar skeleton-days"></div></td>
                                <td><div class="skeleton-bar skeleton-date"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. 域名管理视图 -->
        <div id="view-domains" class="route-view">
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <!-- 管理工具栏 -->
                <div class="toolbar">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i data-lucide="plus-circle" class="input-icon"></i>
                            <input type="text" id="domainInput" class="input-field" 
                                   placeholder="输入单个域名，如 google.com" 
                                   onkeypress="if(event.key==='Enter')addDomain()"
                                   oninput="validateInput(this.value)">
                            <div class="validation-hint" id="domainHint">域名格式不正确</div>
                        </div>
                        <button class="btn btn-primary" onclick="addDomain()" id="addBtn">
                            <i data-lucide="plus" style="width: 15px; height: 15px;"></i>
                            <span>添加域名</span>
                        </button>
                        <button class="btn btn-secondary" onclick="openImportModal()">
                            <i data-lucide="list-plus" style="width: 15px; height: 15px;"></i>
                            <span>批量导入</span>
                        </button>
                    </div>
                    
                    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                        <div class="search-wrapper">
                            <i data-lucide="search" class="input-icon"></i>
                            <input type="text" id="searchInputManage" class="input-field" 
                                   placeholder="过滤管理列表..." 
                                   oninput="handleSearchManage(this.value)">
                            <i data-lucide="x" class="search-clear" id="searchClearBtnManage" onclick="clearSearchManage()"></i>
                        </div>
                    </div>
                </div>

                <!-- 可管理表格数据 -->
                <div class="table-container">
                    <table id="domainTableManage">
                        <thead>
                            <tr>
                                <th class="sortable" onclick="handleSort('domain')" id="sort-manage-domain"><div class="sort-header-container"><span>监控域名</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('port')" id="sort-manage-port"><div class="sort-header-container"><span>端口</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('status')" id="sort-manage-status"><div class="sort-header-container"><span>状态</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('days')" id="sort-manage-days"><div class="sort-header-container"><span>到期余天</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th class="sortable" onclick="handleSort('expire')" id="sort-manage-expire"><div class="sort-header-container"><span>过期时间 / 错误原因</span><i class="sort-icon" data-lucide="chevrons-up-down"></i></div></th>
                                <th style="width: 100px; text-align: center;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="domainListManage">
                            <!-- 骨架屏 -->
                            <tr class="skeleton-row">
                                <td><div class="skeleton-bar skeleton-domain"></div></td>
                                <td><div class="skeleton-bar skeleton-port"></div></td>
                                <td><div class="skeleton-bar skeleton-badge"></div></td>
                                <td><div class="skeleton-bar skeleton-days"></div></td>
                                <td><div class="skeleton-bar skeleton-date"></div></td>
                                <td><div class="skeleton-bar skeleton-port" style="margin: 0 auto;"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. 全屏登录/初始化注册锁屏遮罩层 -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div class="auth-logo-icon">
                <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
            </div>
            <h2 class="auth-title" id="authTitle">系统登录</h2>
            <p class="auth-desc" id="authDesc">请输入管理员凭证以访问控制台</p>
            
            <div class="input-wrapper" style="margin-bottom:16px;">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" id="authUsername" class="input-field" placeholder="管理员用户名">
            </div>
            <div class="input-wrapper password-container" style="margin-bottom:24px;">
                <i data-lucide="lock" class="input-icon"></i>
                <input type="password" id="authPassword" class="input-field" placeholder="密码">
                <button class="eye-btn" onclick="togglePasswordVisibility('authPassword')">
                    <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
                </button>
            </div>
            
            <button class="btn btn-primary" style="width: 100%;" onclick="handleAuthSubmit()" id="authSubmitBtn">
                <span>立即登录</span>
            </button>
        </div>
    </div>

    <!-- 2. 系统设置侧边抽屉 -->
    <div class="drawer-overlay" id="settingsDrawerOverlay" onclick="closeSettingsDrawer()">
        <div class="drawer" id="settingsDrawer" onclick="event.stopPropagation()">

    <!-- Toast 消息容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        /* ---------------------------------------------------------
         * 状态与变量初始化
         * --------------------------------------------------------- */
        let allData = [];
        let currentFilter = '全部';
        let searchQuery = '';
        let searchManageQuery = ''; // 管理视图独立搜索过滤
        let theme = 'dark';
        let isInputValid = true;
        let deleteTargetDomain = null;
        let isSystemInitialized = true; // 是否存在注册用户
        let loggedIn = false; // 是否登录
        let originalSettings = null; // 缓存原始设置用于精细化变更比对
        let lastActivePath = '/dashboard'; // 记住上次活跃路由路径

        const domainRegex = /^([a-zA-Z0-9]|[a-zA-Z0-9][-a-zA-Z0-9]*[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][-a-zA-Z0-9]*[a-zA-Z0-9]))*(:\d+)?$/;

        /* ---------------------------------------------------------
         * 轻量级前端 History 路由器
         * --------------------------------------------------------- */
        function navigate(path, push = true) {
            let targetPath = path;
            if (targetPath.endsWith('/') && targetPath.length > 1) {
                targetPath = targetPath.slice(0, -1);
            }

            // 受保护页面列表（未登录时强制弹出登录锁屏）
            const protectedPaths = ['/dashboard/domains', '/dashboard/settings'];

            // 安全阻断：未登录状态下，访问受保护路径强制切换到 /login
            if (!loggedIn) {
                if (targetPath === '/' || targetPath === '') {
                    targetPath = '/dashboard';
                } else if (protectedPaths.includes(targetPath)) {
                    targetPath = '/login';
                }
            } else {
                // 已登录状态下访问 /login 或 / 自动路由到 /dashboard
                if (targetPath === '/login' || targetPath === '/') {
                    targetPath = '/dashboard';
                }
            }

            // 更新浏览器地址栏
            if (push && window.location.pathname !== targetPath) {
                window.history.pushState(null, '', targetPath);
            } else if (!push && window.location.pathname !== targetPath) {
                window.history.replaceState(null, '', targetPath);
            }

            // 执行界面渲染切换
            if (targetPath === '/login') {
                document.getElementById('navMenu').classList.remove('show');
                document.getElementById('loginEntranceBtn').style.display = 'none';
                document.getElementById('nav-dashboard').style.display = 'none';
                document.getElementById('refreshBtn').style.display = 'none';
                document.getElementById('settingsBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('nav-domains').style.display = 'none';
                showAuthOverlay();
            } else {
                hideAuthOverlay();

                if (loggedIn) {
                    // 已登录：显示导航栏及全部管理功能，隐藏登录按钮
                    document.getElementById('navMenu').classList.add('show');
                    document.getElementById('loginEntranceBtn').style.display = 'none';
                    document.getElementById('nav-dashboard').style.display = 'inline-flex';
                    document.getElementById('nav-domains').style.display = 'inline-flex';
                    document.getElementById('refreshBtn').style.display = 'inline-flex';
                    document.getElementById('settingsBtn').style.display = 'inline-flex';
                    document.getElementById('logoutBtn').style.display = 'inline-flex';
                } else {
                    // 未登录：只读模式，不显示导航栏（不需要菜单切换），只显示登录入口按钮
                    document.getElementById('navMenu').classList.remove('show');
                    document.getElementById('loginEntranceBtn').style.display = 'inline-flex';
                    document.getElementById('nav-dashboard').style.display = 'none';
                    document.getElementById('nav-domains').style.display = 'none';
                    document.getElementById('refreshBtn').style.display = 'none';
                    document.getElementById('settingsBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'none';
                }

                // 处理系统配置抽屉的路由联动显示
                if (targetPath === '/dashboard/settings') {
                    openSettingsDrawerDOM();
                    highlightNavItem('/dashboard/settings');
                } else {
                    closeSettingsDrawerDOM();

                    // 切换主页面路由视图 (监控看板 vs 域名管理)
                    const views = ['dashboard', 'domains'];
                    views.forEach(v => {
                        const el = document.getElementById(`view-${v}`);
                        if (targetPath === `/dashboard/${v}` || (targetPath === '/dashboard' && v === 'dashboard')) {
                            el.classList.add('active');
                            highlightNavItem(targetPath);
                            if (v === 'dashboard') lastActivePath = '/dashboard';
                            else lastActivePath = '/dashboard/domains';
                        } else {
                            el.classList.remove('active');
                        }
                    });
                }

                if (allData.length === 0) {
                    loadDomains();
                }
            }
        }

        function highlightNavItem(path) {
            const items = {
                '/dashboard': 'nav-dashboard',
                '/dashboard/domains': 'nav-domains',
                '/dashboard/settings': 'nav-settings'
            };
            Object.keys(items).forEach(k => {
                const el = document.getElementById(items[k]);
                if (el) {
                    if (path === k || (path === '/dashboard' && k === '/dashboard')) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            });
            lucide.createIcons();
        }

        // 监听浏览器前进/后退
        window.addEventListener('popstate', () => {
            navigate(window.location.pathname, false);
        });

        /* ---------------------------------------------------------
         * 全局权限拦截的 Fetch 包装器
         * --------------------------------------------------------- */
        async function apiFetch(url, options = {}) {
            try {
                const res = await fetch(url, options);
                
                // 401 拦截处理：会话过期或未授权时，自动更新登录态并降级到只读看板
                if (res.status === 401) {
                    loggedIn = false;
                    navigate('/dashboard');
                    throw new Error("Unauthorized");
                }
                
                return res;
            } catch (e) {
                if (e.message !== "Unauthorized") {
                    throw e;
                }
                return null;
            }
        }

        /* ---------------------------------------------------------
         * 页面初始化与认证状态检查
         * --------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            checkAuthStatus();
        });

        async function checkAuthStatus() {
            try {
                const res = await fetch("/api/auth/status");
                const data = await res.json();
                
                isSystemInitialized = data.has_users;
                loggedIn = data.logged_in;
                
                // 根据当前的 url 路径和登录状态物理分发路由
                navigate(window.location.pathname, false);
            } catch (e) {
                showToast("连接服务器认证失败", "error");
                renderErrorState();
            }
        }

        /* ---------------------------------------------------------
         * 登录与注册安全层控制
         * --------------------------------------------------------- */
        function showAuthOverlay() {
            const overlay = document.getElementById('authOverlay');
            const title = document.getElementById('authTitle');
            const desc = document.getElementById('authDesc');
            const submitBtn = document.querySelector('#authSubmitBtn span');

            // 隐藏看板内容防止透出
            document.body.classList.add('auth-active');
            overlay.classList.add('show');
            
            if (!isSystemInitialized) {
                title.textContent = "创建管理员账号";
                desc.textContent = "检测到系统首次运行，请设置您的初始管理员账号和密码";
                submitBtn.textContent = "完成注册";
            } else {
                title.textContent = "控制台锁定";
                desc.textContent = "请输入您的管理员凭证以访问 SSL 监控控制台";
                submitBtn.textContent = "立即登录";
            }
            lucide.createIcons();
        }

        function hideAuthOverlay() {
            document.body.classList.remove('auth-active');
            document.getElementById('authOverlay').classList.remove('show');
            // 清理输入框
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const submitBtn = document.getElementById('authSubmitBtn');

            if (!username || !password) {
                showToast("用户名和密码不能为空", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = isSystemInitialized ? "正在登录..." : "正在创建...";

            const url = isSystemInitialized ? "/api/auth/login" : "/api/auth/register";

            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    if (!isSystemInitialized) {
                        showToast("管理员账号创建成功，请登录");
                        isSystemInitialized = true;
                        navigate('/login');
                    } else {
                        showToast("登录验证成功");
                        loggedIn = true;
                        navigate('/dashboard');
                    }
                } else {
                    showToast(data.error || "验证失败", "error");
                }
            } catch (e) {
                showToast("请求失败，网络异常", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = isSystemInitialized ? "立即登录" : "完成注册";
            }
        }

        async function handleLogout() {
            try {
                const res = await fetch("/api/auth/logout", { method: "POST" });
                if (res.ok) {
                    showToast("已安全注销退出");
                    loggedIn = false;
                    closeSettingsDrawer();
                    // 注销后回到只读公开看板，而不是锁屏页
                    navigate('/dashboard');
                }
            } catch (e) {
                showToast("退出登录请求失败", "error");
            }
        }

        function togglePasswordVisibility(inputId) {
            const field = document.getElementById(inputId);
            const icon = field.nextElementSibling.querySelector('i, svg');
            
            if (field.type === "password") {
                field.type = "text";
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                field.type = "password";
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        /* ---------------------------------------------------------
         * 主题控制 (Dark/Light)
         * --------------------------------------------------------- */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                theme = savedTheme;
            } else {
                theme = 'dark';
            }
            applyTheme();
        }

        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            applyTheme();
            showToast(`已切换至${theme === 'light' ? '明亮' : '暗黑'}模式`, 'info');
        }

        function applyTheme() {
            const btn = document.getElementById('themeBtn');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                btn.innerHTML = '<i data-lucide="sun" style="width: 16px; height: 16px;"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                btn.innerHTML = '<i data-lucide="moon" style="width: 16px; height: 16px;"></i>';
            }
            lucide.createIcons();
        }

        /* ---------------------------------------------------------
         * 消息 Toast
         * --------------------------------------------------------- */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            let iconName = 'check-circle';
            if (type === 'error') iconName = 'x-circle';
            if (type === 'info') iconName = 'info';

            toast.innerHTML = `
                <i class="toast-icon" data-lucide="${iconName}"></i>
                <div class="toast-content">
                    <div class="toast-message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.add('show'), 50);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 4000);
        }

        /* ---------------------------------------------------------
         * 域名单个添加输入校验
         * --------------------------------------------------------- */
        function validateInput(value) {
            const inputField = document.getElementById('domainInput');
            if (!value.trim()) {
                inputField.classList.remove('invalid');
                isInputValid = true;
                return;
            }
            const parsed = parseDomain(value);
            const isDomainOrIpv4 = domainRegex.test(parsed.host);
            const colonCount = (parsed.host.match(/:/g) || []).length;
            const isIpv6 = /^[0-9a-fA-F:]+$/.test(parsed.host) && colonCount >= 2 && colonCount <= 7;

            if (isDomainOrIpv4 || isIpv6) {
                inputField.classList.remove('invalid');
                isInputValid = true;
            } else {
                inputField.classList.add('invalid');
                isInputValid = false;
            }
        }

        function parseDomain(d) {
            let clean = d.trim();
            if (clean.indexOf("http://") === 0) clean = clean.substring(7);
            else if (clean.indexOf("https://") === 0) clean = clean.substring(8);
            if (clean.indexOf("/") !== -1) clean = clean.split("/")[0];
            
            // 处理带方括号的 IPv6 地址，例如 [2001:db8::1]:443 或 [2001:db8::1]
            if (clean.startsWith("[")) {
                const endBracket = clean.indexOf("]");
                if (endBracket !== -1) {
                    const host = clean.substring(1, endBracket);
                    let port = "443";
                    const portPart = clean.substring(endBracket + 1);
                    if (portPart.startsWith(":")) {
                        const p = parseInt(portPart.substring(1));
                        if (!isNaN(p)) {
                            port = p.toString();
                        }
                    }
                    return { host, port };
                }
            }

            // 处理普通 IPv6 地址，包含多个冒号且无方括号
            const colonCount = (clean.match(/:/g) || []).length;
            if (colonCount > 1) {
                const lastColon = clean.lastIndexOf(":");
                const lastPart = clean.substring(lastColon + 1);
                if (/^\d+$/.test(lastPart)) {
                    return { host: clean.substring(0, lastColon), port: lastPart };
                }
                return { host: clean, port: "443" };
            }

            // 普通域名/IPv4 且带端口，例如 example.com:8080 或 127.0.0.1:8080
            if (clean.indexOf(":") !== -1) {
                const parts = clean.split(":");
                return { host: parts[0], port: parts[1] || "443" };
            }

            return { host: clean, port: "443" };
        }

        function getFilteredData() {
            const filtered = allData.filter(item => {
                const parsed = parseDomain(item.domain);
                const matchSearch = parsed.host.toLowerCase().includes(searchQuery) || 
                                    parsed.port.includes(searchQuery);
                if (!matchSearch) return false;

                const ssl = item.ssl;
                if (currentFilter === '全部') return true;
                if (currentFilter === '关注') {
                    return !ssl.success || ssl.level !== '正常';
                }
                if (currentFilter === '失败') {
                    return !ssl.success;
                }
                return ssl.success && ssl.level === currentFilter;
            });
            
            return sortData(filtered);
        }

        /* ---------------------------------------------------------
         * 列表排序控制
         * --------------------------------------------------------- */
        let sortKey = '';
        let sortOrder = 'asc'; // 'asc' 或 'desc'

        function handleSort(key) {
            if (sortKey === key) {
                sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                sortKey = key;
                sortOrder = 'asc';
            }
            renderTable();
        }

        function sortData(dataList) {
            if (!sortKey) return dataList;
            
            return [...dataList].sort((a, b) => {
                let valA, valB;
                
                if (sortKey === 'domain') {
                    valA = parseDomain(a.domain).host;
                    valB = parseDomain(b.domain).host;
                } else if (sortKey === 'port') {
                    valA = parseInt(parseDomain(a.domain).port) || 443;
                    valB = parseInt(parseDomain(b.domain).port) || 443;
                } else if (sortKey === 'status') {
                    const levelPriority = { '正常': 4, '提醒': 3, '警告': 2, '严重': 1, '失败': 0 };
                    valA = a.ssl.success ? levelPriority[a.ssl.level] : 0;
                    valB = b.ssl.success ? levelPriority[b.ssl.level] : 0;
                } else if (sortKey === 'days') {
                    valA = a.ssl.success ? a.ssl.days : 99999;
                    valB = b.ssl.success ? b.ssl.days : 99999;
                } else if (sortKey === 'expire') {
                    valA = a.ssl.success ? a.ssl.expire : a.ssl.error;
                    valB = b.ssl.success ? b.ssl.expire : b.ssl.error;
                }

                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });
        }

                    }

        /* ---------------------------------------------------------
         * 仪表盘统计计算与健康度 Dashboard
         * --------------------------------------------------------- */
        function calculateStats() {
            let okCount = 0, infoCount = 0, warnCount = 0, critCount = 0, failCount = 0;

            allData.forEach(item => {
                const ssl = item.ssl;
                if (!ssl.success) {
                    failCount++;
                } else {
                    switch (ssl.level) {
                        case '正常': okCount++; break;
                        case '提醒': infoCount++; break;
                        case '警告': warnCount++; break;
                        case '严重': critCount++; break;
                    }
                }
            });

            document.getElementById('stat-ok').textContent = okCount;
            document.getElementById('stat-info').textContent = infoCount;
            document.getElementById('stat-warn').textContent = warnCount;
            document.getElementById('stat-crit').textContent = critCount;
            document.getElementById('stat-fail').textContent = failCount;

            const total = allData.length;
            let healthScore = 100;
            let desc = "系统就绪，等待导入域名数据。";

            if (total > 0) {
                const totalPoints = (okCount * 100) + (infoCount * 80) + (warnCount * 50);
                healthScore = Math.round(totalPoints / total);
                
                if (healthScore === 100) desc = `全部 ${total} 个域名的证书均安全运行中。`;
                else if (healthScore >= 80) desc = `有证书临近过期，系统处于轻微提醒级别。`;
                else if (healthScore >= 50) desc = `部分证书即将过期，请及时跟进续期。`;
                else desc = `严重危险！检测到即将过期或已损坏的证书！`;
            }

            const scoreEl = document.getElementById('healthScore');
            const barEl = document.getElementById('healthBar');
            const descEl = document.getElementById('healthDesc');

            scoreEl.textContent = `${healthScore}%`;
            barEl.style.width = `${healthScore}%`;
            descEl.textContent = desc;

            if (healthScore >= 90) {
                scoreEl.style.color = 'var(--status-ok)';
                barEl.style.background = 'linear-gradient(90deg, #3b82f6 0%, #10b981 100%)';
            } else if (healthScore >= 70) {
                scoreEl.style.color = 'var(--status-info)';
                barEl.style.background = 'linear-gradient(90deg, #3b82f6 0%, #fbbf24 100%)';
            } else if (healthScore >= 50) {
                scoreEl.style.color = 'var(--status-warn)';
                barEl.style.background = 'linear-gradient(90deg, #fbbf24 0%, #f97316 100%)';
            } else {
                scoreEl.style.color = 'var(--status-crit)';
                barEl.style.background = 'linear-gradient(90deg, #ef4444 0%, #b91c1c 100%)';
            }
        }

         * --------------------------------------------------------- */
        async function refreshSingle(domain) {
            const rowId = `row-${btoa(domain).replace(/=/g, '')}`;
            const row = document.getElementById(rowId);
            
            if (row) {
                row.classList.add('refreshing-row');
                const rowIcon = row.querySelector('.btn-icon-only i, .btn-icon-only svg');
                if (rowIcon) rowIcon.classList.add('spin');
            }

            try {
                const res = await apiFetch(`/api/domains/check?domain=${encodeURIComponent(domain)}`);
                if (!res) return;
                
                if (!res.ok) throw new Error("检查失败");
                const freshItem = await res.json();
                
                const index = allData.findIndex(item => item.domain === domain);
                if (index !== -1) {
                    allData[index] = freshItem;
                }
                
                renderAll();
                showToast(`域名 ${parseDomain(domain).host} 已独立刷新完成`);
            } catch (e) {
                if (e.message !== "Unauthorized") {
                    showToast(`刷新域名失败`, "error");
                }
            } finally {
                const latestRow = document.getElementById(rowId);
                if (latestRow) {
                    latestRow.classList.remove('refreshing-row');
                    const rowIcon = latestRow.querySelector('.btn-icon-only i, .btn-icon-only svg');
                    if (rowIcon) rowIcon.classList.remove('spin');
                }
            }
        }

                showToast("请输入有效域名！", "error");
                return;
            }

            const input = document.getElementById("domainInput");
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const parsed = parseDomain(rawVal);
            let formattedDomain = parsed.host;
            if (parsed.port !== "443") {
                formattedDomain = `${parsed.host}:${parsed.port}`;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = true;
            addBtn.innerHTML = '<i data-lucide="loader" class="spin" style="width: 15px; height: 15px;"></i>';
            lucide.createIcons();

            try {
                const res = await apiFetch("/api/domains", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ domain: formattedDomain })
                });
                if (!res) return;
                
                const data = await res.json();
                if (res.ok) {
                    showToast(`域名 ${parsed.host} 成功添加监控`);

                if (e.message !== "Unauthorized") {
                    showToast("添加失败，请重试", "error");
                }
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i data-lucide="plus" style="width: 15px; height: 15px;"></i><span>添加</span>';
                lucide.createIcons();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
